syntax = "proto3";

package codevaldcomm.v1;

option go_package = "github.com/aosanya/CodeValdComm/gen/go/codevaldcomm/v1;codevaldcommv1";

// CommService is the gRPC service exposed by CodeValdComm.
// Entity and relationship CRUD operations are served directly by
// EntityService from CodeValdSharedLib (registered in cmd/main.go).
// CommService exposes only service-level operations that require comm domain logic.
service CommService {
  // GetSchema returns the active comm schema for the given agency.
  // Error: NOT_FOUND if no schema has been seeded for the agency.
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);

  // RollbackByWorkflowRun applies the CodeValdComm leg of the WorkflowRun
  // rollback coordinator (FEAT-20260602-004 Phase 2). For each distinct
  // channel that holds at least one Message tagged with the rolled-back
  // workflow_run_id, a single follow-up "pipeline rolled back" notification
  // Message is posted. Prior Messages are preserved as audit. Channels that
  // already received a rollback notification for this run are skipped, so
  // the call is observably idempotent.
  rpc RollbackByWorkflowRun(RollbackByWorkflowRunRequest) returns (RollbackByWorkflowRunResponse);
}

// GetSchemaRequest identifies the agency whose active comm schema to return.
message GetSchemaRequest {
  string agency_id = 1;
}

// GetSchemaResponse carries the active comm schema metadata.
message GetSchemaResponse {
  // id is the schema identifier (e.g. "comm-schema-v1").
  string id = 1;

  // version is the numeric schema version (1-based).
  int32 version = 2;

  // tag is the human-readable version label (e.g. "v1").
  string tag = 3;

  // agency_id is the agency this schema is scoped to.
  string agency_id = 4;
}

// RollbackByWorkflowRunRequest is the input to the CodeValdComm leg of the
// WorkflowRun rollback coordinator (FEAT-20260602-004 Phase 2). The
// coordinator in CodeValdWork calls this once per affected agency.
message RollbackByWorkflowRunRequest {
  // agency_id is required — Comm scopes every entity by agency.
  string agency_id = 1;
  // workflow_run_id is required — a global "rollback every run" sweep is
  // intentionally not supported.
  string workflow_run_id = 2;
  // reason is the operator-supplied rollback reason recorded on the
  // rollback notification Message body and forwarded in the
  // comm.pipeline.rolled_back event payload.
  string reason = 3;
}

// RollbackByWorkflowRunResponse summarises the per-channel outcomes. Every
// channel that holds at least one Message tagged with the rolled-back
// workflow_run_id appears in exactly one of the two slices.
message RollbackByWorkflowRunResponse {
  string workflow_run_id = 1;
  // notified_channel_ids: channels that received a fresh rollback
  // notification Message during this call.
  repeated string notified_channel_ids = 2;
  // skipped_channel_ids: channels that already held a rollback notification
  // for this run; included so the call is observably idempotent.
  repeated string skipped_channel_ids = 3;
  // notification_message_ids: the Message IDs created during this call,
  // aligned 1:1 with notified_channel_ids.
  repeated string notification_message_ids = 4;
}
